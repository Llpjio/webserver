services:
  - type: web
    name: e4all-coordinator
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: e4all-db
          property: connectionString

databases:
  - name: e4all-db
    plan: free
    region: oregon
    databaseName: e4all
    user: e4all_user
